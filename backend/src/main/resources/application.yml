server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: tunewave-music-player
  
  # Supabase PostgreSQL Connection (Configurable via Environment Variables)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres.xyzcompany}
    password: ${SPRING_DATASOURCE_PASSWORD:supabasePassword123!}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # Caffeine Backend Caching
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterAccess=600s

# TuneWave Custom Settings
tunewave:
  jwt:
    secret: ${TUNEWAVE_JWT_SECRET:9a6f8b12c4e5d67890a1b2c3d4e5f67890a1b2c3d4e5f67890a1b2c3d4e5f678}
    expiration-ms: ${TUNEWAVE_JWT_EXPIRATION_MS:86400000} # 24 Hours
  
  supabase:
    url: ${SUPABASE_URL:https://xyzcompany.supabase.co}
    anon-key: ${SUPABASE_ANON_KEY:eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummyKey}
    storage:
      bucket-songs: music-files
      bucket-covers: album-covers
