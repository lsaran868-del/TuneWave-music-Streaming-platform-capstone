server:
  port: ${SERVER_PORT:${PORT:8081}}
  servlet:
    context-path: /

spring:
  application:
    name: tunewave-music-player
  
  # Database Configuration (PostgreSQL / Supabase or In-Memory Dev Fallback)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:tunewavedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # Caffeine Caching
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterAccess=600s

# TuneWave Custom Settings
tunewave:
  jwt:
    secret: ${JWT_SECRET:${TUNEWAVE_JWT_SECRET:tunewaveSuperSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLong2026}}
    expiration-ms: ${JWT_EXPIRATION_MS:${TUNEWAVE_JWT_EXPIRATION_MS:86400000}} # 24 Hours
  
  supabase:
    url: ${SUPABASE_URL:https://xyzcompany.supabase.co}
    anon-key: ${SUPABASE_ANON_KEY:eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummyKey}
    storage:
      bucket-songs: music-files
      bucket-covers: album-covers

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}}
